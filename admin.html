<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP Overview</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-shell{width:min(100% - 32px,1100px);margin:50px auto}.admin-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.admin-head h1{margin:0;font-family:var(--heading)}.prototype-note{padding:12px 14px;border-radius:10px;background:#fff1cf;color:#654d1c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{padding:20px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}.stat span{display:block;color:var(--muted);font-size:.85rem}.stat strong{font:400 2rem var(--heading)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:13px 15px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.admin-head{align-items:start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="admin-shell">
    <section id="login-panel" class="rsvp-card" hidden>
      <p class="eyebrow">Private organizer access</p>
      <h1>Sign in</h1>
      <p>Use the organizer account configured in Supabase.</p>
      <form id="login-form">
        <label class="field"><span>Email</span><input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
        <div id="login-error" class="form-error" role="alert" hidden></div>
        <button class="button button-primary" type="submit">Sign in</button>
      </form>
    </section>
    <section id="dashboard">
    <div class="admin-head"><div><p class="eyebrow">Organizer view</p><h1>RSVP Overview</h1></div><button class="button button-secondary" id="export">Export CSV</button></div>
    <p class="prototype-note" id="mode-note"><strong>Prototype:</strong> this page reads responses saved in this browser.</p>
    <section class="stats" id="stats"></section>
    <div class="table-wrap"><table><thead><tr><th>Household</th><th>Status</th><th>Ceremony</th><th>Breakfast</th><th>Lunch</th><th>Dietary notes</th></tr></thead><tbody id="responses"></tbody></table></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
